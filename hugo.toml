baseURL = "https://wangyifan.github.io/linux-blog/"
relativeURLs = true
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
title = "我的个人博客"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  fuseOpts = { isCaseSensitive = false, shouldSort = true, location = 0, distance = 1000, threshold = 0.4, minMatchCharLength = 0, keys = ["title", "permalink", "summary", "content"] }

[params.homeInfoParams]
  Title = "你好，我是王一凡"
  Content = "材料科学与工程专业本科生，正在学习 Linux 与系统管理，记录课程实验、Shell 脚本和排错过程。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/wangyifan"

